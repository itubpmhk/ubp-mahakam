; upload berita: video sampai 100 MB
upload_max_filesize = 110M
post_max_size = 120M
memory_limit = 256M
max_execution_time = 120
expose_php = Off
date.timezone = Asia/Makassar

; speed (the container is rebuilt on every update, so no need to re-check files)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
