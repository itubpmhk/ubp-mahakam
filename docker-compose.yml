services:
  app:
    build: .
    image: ubp-mahakam-web
    container_name: ubp-mahakam-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./.env:/var/www/html/.env:ro          # .env server dikelola manual, tidak lewat Git
      - storage:/var/www/html/storage         # gambar/video upload, log, sesi (tetap ada saat update)

  db:
    image: mysql:8.4
    container_name: ubp-mahakam-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Makassar
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  storage:
  db_data:
